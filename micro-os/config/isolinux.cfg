UI vesamenu.c32
PROMPT 0
TIMEOUT 50
DEFAULT aetheros

MENU TITLE AetherOS Micro (Debian 12 Bookworm) - Boot Menu
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL aetheros
  MENU LABEL Boot AetherOS (Windows-Style GUI + Research Lab + Snake)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet splash

LABEL aetheros-failsafe
  MENU LABEL Boot AetherOS (Failsafe Safe Graphics VESA)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components nomodeset noapic noacpi nosplash
